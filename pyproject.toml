[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torch-preflight"
version = "0.5.0"
description = "Static analyzer for PyTorch training code: catches VRAM leaks, silent convergence bugs, and GPU pipeline stalls before you pay for the run."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Himanshu Janbandhu" }]
keywords = ["pytorch", "linter", "static-analysis", "cuda", "vram", "libcst", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "libcst>=1.1",
  "rich>=13.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Extras add dependencies only — the wheel is byte-identical either way (RFC 0001 §4).
hub = ["huggingface_hub>=0.20"]      # live architecture lookup for `estimate --online`
vram = ["torch>=2.1"]                # exact meta-device profiling (phase 2)
all = ["torch-preflight[hub,vram]"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/highwaterlabs/torch-preflight"
Documentation = "https://github.com/highwaterlabs/torch-preflight/tree/main/docs"
Source = "https://github.com/highwaterlabs/torch-preflight"
Changelog = "https://github.com/highwaterlabs/torch-preflight/blob/main/CHANGELOG.md"
Issues = "https://github.com/highwaterlabs/torch-preflight/issues"

[project.scripts]
torch-preflight = "torch_preflight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/torch_preflight"]
artifacts = ["src/torch_preflight/vram/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are opt-in: `pytest -m network`. Everything else replays captured data.
addopts = "-m 'not network'"
markers = ["network: hits a real remote service (deselected by default)"]

# torch-preflight lints itself with defaults; example fixtures are intentionally buggy.
[tool.torch-preflight]
exclude = ["examples"]
